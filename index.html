<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seni Tanıyalım</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#ecebe6;--card:#fff;--ink:#1a1d22;--soft:#5d636d;--accent:#b9741a;--on:#fff;--hot:#c0452e;--ok:#2f7d5b;--line:#d3d1ca;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--card:#1c1f25;--ink:#f1ece4;--soft:#9aa0a8;--accent:#e3a63c;--on:#17130b;--hot:#e0654a;--ok:#4fbf8f;--line:#2e333c}}
:root[data-theme="dark"]{--bg:#121418;--card:#1c1f25;--ink:#f1ece4;--soft:#9aa0a8;--accent:#e3a63c;--on:#17130b;--hot:#e0654a;--ok:#4fbf8f;--line:#2e333c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:17px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,.hd{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;letter-spacing:.01em}
main{max-width:560px;margin:0 auto;padding:20px 18px 48px;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.bar{flex:1;height:10px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .45s ease}.lvl{font-family:"Barlow Condensed";font-weight:700;font-size:1.15rem;color:var(--accent);white-space:nowrap}
.box{display:flex;gap:8px;flex-wrap:wrap;min-height:34px;margin-bottom:14px;font-size:22px}.box span{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.card{background:var(--card);border-radius:14px;padding:25px 21px;border:1px solid var(--line);border-left:5px solid var(--accent)}.card.in{animation:slide .3s ease}
@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
h1{font-size:2.7rem;line-height:1;margin:6px 0 12px}h2{font-size:1.9rem;line-height:1.08;margin:4px 0 8px}
.sub{color:var(--soft);margin:0 0 18px}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.opt{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:12px 8px;font:inherit;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:76px;transition:transform .12s,border-color .12s,background .12s}
.opt b{font-size:25px;font-weight:400}.opt small{font-size:.85rem}.opt:hover{border-color:var(--soft)}.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);transform:translateY(-2px)}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.sw button{width:100%;aspect-ratio:1;border-radius:10px;border:2px solid var(--line);cursor:pointer;transition:transform .12s}.sw button.on{border:3px solid var(--ink);transform:scale(1.08)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:13px 15px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}.opt:focus-visible,.sw button:focus-visible,.btn:focus-visible,.skip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea{min-height:96px;resize:vertical}.row{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:13px 26px;font:700 1.15rem "Barlow Condensed",sans-serif;letter-spacing:.02em;color:var(--on);background:var(--accent);cursor:pointer;transition:transform .1s,filter .1s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;cursor:default;filter:none}.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--soft)}
.skip{background:none;border:0;color:var(--soft);font:inherit;cursor:pointer;text-decoration:underline;padding:8px}
.note{font-size:.9rem;color:var(--soft);margin-top:15px}.admin{margin:20px 0 2px;padding:14px 15px;border:1px dashed color-mix(in srgb,var(--accent) 65%,var(--line));border-radius:11px;background:color-mix(in srgb,var(--accent) 7%,transparent)}
.admin-head{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--accent);margin-bottom:7px}.admin p{margin:5px 0}.admin .guess{font-weight:700}.admin .comment{color:var(--soft);font-size:.94rem}
.sum{list-style:none;padding:0;margin:14px 0 0}.sum li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.sum li span:first-child{color:var(--soft)}.sum li span:last-child{font-weight:700;text-align:right}
.rank{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:3px 12px;font:700 1.05rem "Barlow Condensed";margin-bottom:6px}
.score{margin:15px 0;padding:15px;border-radius:11px;background:color-mix(in srgb,var(--ok) 10%,transparent);border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line))}
.score strong{color:var(--ok);font-size:1.3rem}.score-list{margin:8px 0 0;padding-left:20px}.score-list li{margin:5px 0}
.fl{position:fixed;pointer-events:none;font-size:24px;z-index:20;animation:up 1s ease-out forwards}@keyframes up{to{transform:translateY(-110px);opacity:0}}
@media(max-width:380px){main{padding:16px 12px 36px}.card{padding:21px 16px}.sw{grid-template-columns:repeat(5,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  <div class="top" id="top" hidden><div class="bar"><i id="fill"></i></div><div class="lvl" id="lvl"></div></div>
  <div class="box" id="box" aria-label="Kazandığın rozetler"></div>
  <section class="card in" id="card" aria-live="polite"></section>
</main>
<script>
// AYARLAR
const SENDER = "Hamza";
const WHATSAPP = "905537643914"; // Boş bırakırsan WhatsApp kişi seçme ekranı açılır.

const Q = [
 {k:"Lakap",t:"text",e:"🎯",q:"Önce Lakap. Sana nasıl hitap edeyim?",s:"İlayda mı Yaren mi ya da sana hitap etmemi istediğin lakap.",ph:"Adın veya lakabın",admin:{guess:"Bana kalırsa sana en çok zorba yakışıyor.",comment:"İlk izlenim önemli; bakalım tahminim tutacak mı?"}},
 {k:"renk",t:"color",e:"🎨",q:"Rengin ne?",s:"",o:[["Siyah","#15171a"],["Antrasit","#41464d"],["Gri","#92979e"],["Beyaz","#f4f2ec"],["Krem","#e8dcc5"],["Bej","#c9ad88"],["Kahverengi","#70452e"],["Bordo","#7a1f2e"],["Kırmızı","#d0342c"],["Mercan","#ef7865"],["Turuncu","#e8862a"],["Hardal","#d6a928"],["Sarı","#f0d94b"],["Zeytin","#777b35"],["Zümrüt","#1f7a5a"],["Mint","#91c9ae"],["Turkuaz","#32a6a0"],["Gökyüzü","#5aa7e0"],["Lacivert","#1f3a68"],["Mavi","#3476c5"],["Lavanta","#aa91d0"],["Mor","#6a3fa0"],["Pembe","#e99ab8"],["Pudra","#e8c4c8"]],admin:{guess:"Lacivert ya da siyah diye tahmin ediyorum.",comment:"Daha çok güçlü ve zamansız tonlara yakın olduğunu düşünüyorum."}},
 {k:"cikolata",t:"choice",e:"🍫",q:"Çikolata seçimi, tavrını gösterir.",s:"Kutu açıldı. İlk hangisine uzanırsın?",o:[["🍫","Sütlü"],["🖤","Bitter"],["🤍","Beyaz"],["🥜","Fındıklı"],["🍓","Çilekli"],["🍊","Portakallı"],["🥥","Hindistan cevizli"],["🍯","Karamelli"]],admin:{guess:"Bitter",comment:"Daha yoğun ve karakterli tatları sevebileceğini düşünüyorum."}},
 {k:"kahve",t:"choice",e:"☕",q:"Sabahı ne başlatır?",s:"Kahve, çay, soğuk bir şeyler ya da hiçbiri?",o:[["☕","Türk kahvesi"],["🥛","Latte"],["☕","Americano"],["🫘","Espresso"],["🧊","Iced latte"],["🥤","Cold brew"],["🍵","Yeşil çay"],["🫖","Siyah çay"],["🍫","Sıcak çikolata"],["🧋","Bubble tea"],["🥤","Meyve suyu"],["🚫","Hiçbiri"]],admin:{guess:"Americano",comment:"Kahve seviyorsan da çok sert olmayan, ya da sabah ayıltan sertlikte seçersin diye tahmin ediyorum."}},
 {k:"tatli",t:"choice",e:"🍰",q:"Tatlı mı, tuzlu mu?",s:"Tek seçim hakkın var, ama dürüst ol.",o:[["🍰","Tatlı"],["🍟","Tuzlu"],["🍿","İkisi de"],["🌶️","Acılı"]],admin:{guess:"İkisi de",comment:"Canı anlık ne isterse onu seçenlerdensin gibi geliyor."}},
 {k:"yemek",t:"choice",e:"🍽️",q:"Bir yemek seçmen gerekse hangisi?",s:"Favorini seç; menüde sadece bir hak var.",o:[["🍕","Pizza"],["🍔","Burger"],["🍣","Sushi"],["🍝","Makarna"],["🌮","Taco"],["🥙","Döner / kebap"],["🍜","Uzak Doğu"],["🥗","Salata"],["🍲","Ev yemeği"],["🍗","Tavuk"],["🥩","Et"],["🍳","Kahvaltı"]],admin:{guess:"Pizza veya makarna",comment:"Hem keyifli hem de garanti seçeneklere yönelebileceğini düşünüyorum."}},
 {k:"dogum",t:"date",e:"🎂",q:"Doğum günün ne zaman?",s:"Yılı yazmak zorunda değilsin.",note:"Yılı bilmesem de olur, gün ve ay yeter.",admin:{guess:"Gününü henüz bilmiyorum.",comment:"Bu soruda tahmin yürütmek yerine senden öğrenmek daha iyi."}},
 {k:"mekan",t:"choice",e:"🧭",q:"Bir günlük izin, nereye kaçarsın?",s:"Plan yok, sadece içgüdü.",o:[["🌊","Deniz kenarı"],["⛰️","Dağ yolu"],["🌲","Orman / doğa"],["🏙️","Şehir turu"],["🏡","Evde film"],["🏕️","Kamp"],["🏛️","Tarihi yerler"],["✈️","Yurt dışı"],["🏝️","Ada / koy"],["🎡","Eğlence parkı"]],admin:{guess:"Evde Film Kitap Dizi Spor",comment:"Kalabalıktan uzaklaşıp biraz nefes almayı tercih edebilirsin."}},
 {k:"muzik",t:"multi",e:"🎧",q:"Kulaklığında ne çalıyor?",s:"İstediğin kadar seç.",o:[["🎸","Rock"],["🤘","Metal"],["🎤","Pop"],["🎷","Caz"],["🎻","Klasik"],["🎹","Lo-fi"],["🥁","Rap / Hip-hop"],["🪕","Türkçe sözlü"],["🌙","Indie"],["🎛️","Elektronik"],["💿","R&B / Soul"],["🪇","Latin"],["🎼","Film müzikleri"],["🔀","Karışık"]],admin:{guess:["Caz"],comment:"Tek bir türe bağlı kalmadığını, ruh hâline göre liste değiştirdiğini tahmin ediyorum."}},
 {k:"cicek",t:"choice",e:"💐",q:"Bir gün çiçek alsam, hangisi?",s:"Kaçış yok, bir tanesini seç.",o:[["🌹","Gül"],["⚜️","Zambak"],["🌷","Lale"],["🌼","Papatya"],["🪻","Lavanta"],["🌸","Kiraz çiçeği"],["🌺","Hibiskus"],["🌿","Orkide"],["💐","Mevsim buketi"],["🌾","Papatya / kır çiçeği"]],admin:{guess:"Zambak",comment:"Zambak dedik sadece içgüdü"}},
 {k:"mevsim",t:"choice",e:"🍂",q:"En sevdiğin mevsim hangisi?",s:"Hava durumundan çok hissettirdiği şey önemli.",o:[["🌸","İlkbahar"],["☀️","Yaz"],["🍂","Sonbahar"],["❄️","Kış"]],admin:{guess:"Sonbahar",comment:"Biraz sakin, biraz romantik bir atmosferi sevebilirsin."}},
 {k:"film",t:"multi",e:"🎬",q:"Film veya dizi türlerin neler?",s:"Birden fazla seçebilirsin.",o:[["😂","Komedi"],["❤️","Romantik"],["🧠","Psikolojik"],["🕵️","Gizem / polisiye"],["👻","Korku"],["🚀","Bilim kurgu"],["🐉","Fantastik"],["💥","Aksiyon"],["🎭","Dram"],["📚","Belgesel"],["🧩","Gerilim"],["🧸","Animasyon"]],admin:{guess:["Psikolojik","Gizem / polisiye","Bilim kurgu"],comment:"Sadece vakit geçirmekten ziyade düşündüren ve merak uyandıran hikâyeleri sevebilirsin."}},
 {k:"hayvan",t:"choice",e:"🐾",q:"Bir ev arkadaşı seçsen?",s:"Bakımını üstlenebileceğin bir canlı düşün.",o:[["🐱","Kedi"],["🐶","Köpek"],["🐰","Tavşan"],["🐦","Kuş"],["🐢","Kaplumbağa"],["🐠","Balık"],["🦎","Sürüngen"],["🐹","Hamster"]],admin:{guess:"Köpek",comment:"Köpek gibi sezdim"}},
 {k:"sosyal",t:"choice",e:"🫶",q:"Sosyal ortamda hangisisin?",s:"Kendini en yakın hissettiğin seçeneği işaretle.",o:[["🗣️","Sohbeti başlatan"],["👂","İyi dinleyen"],["🎉","Ortamın enerjisi"],["🧩","Önce gözlemleyen"],["🤝","Yakın çevresiyle rahat"],["🌗","Ortamına göre değişir"]],admin:{guess:"Önce gözlemleyen, sonra açılan",comment:"İlk etapta insanları tartıp sonrasında daha rahat davrandığını tahmin ediyorum."}},
 {k:"hobi",t:"multi",e:"🎨",q:"Boş zamanında neler yapmayı seversin?",s:"Sana uyanların hepsini seç.",o:[["📚","Kitap okumak"],["🎮","Oyun oynamak"],["🎬","Film / dizi"],["🏋️","Spor"],["📷","Fotoğraf çekmek"],["🎨","Çizim / tasarım"],["🍳","Yemek yapmak"],["🎵","Müzik"],["🌍","Gezmek"],["🌱","Doğada vakit geçirmek"],["💻","Üretmek / öğrenmek"],["🛍️","Alışveriş"]],admin:{guess:["Müzik","Spor","Film / dizi"],comment:"Bunu biliyoruz ama çaktırmazsan sevinirim"}},
 {k:"hayal",t:"area",e:"🏁",q:"Son soru: Yapmak istediğin ama henüz yapmadığın bir şey?",s:"Bir yer, bir yemek, bir macera. Ne varsa.",ph:"Mesela: Gün doğumunu bir dağ başında izlemek",admin:{guess:"Aklında uzun zamandır ertelediğin bir gezi veya deneyim var.",comment:"Umarım yakın zamanda bunu gerçekten yapma fırsatın olur."}}
];

const A={};let i=-1;const $=id=>document.getElementById(id);const card=$("card");
const badges=["⚡","🔥","🏆","🎯","💎","🚀","🥇","🛡️","⭐","🌈","🎧","🌻","🧭","🎬","🐾"];
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n}
function spark(x,y){const n=el("div","fl",["⚡","🔥","⭐"][Math.random()*3|0]);n.style.left=x+"px";n.style.top=y+"px";document.body.append(n);setTimeout(()=>n.remove(),1000)}
function burst(ev){const r=ev&&ev.currentTarget?ev.currentTarget.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0};for(let k=0;k<3;k++)setTimeout(()=>spark(r.left+r.width/2+(Math.random()*60-30),r.top),k*70)}
function show(build){card.classList.remove("in");void card.offsetWidth;card.replaceChildren();build(card);card.classList.add("in")}
function intro(){show(c=>{c.append(el("h1",null,"Seni biraz tanımak istiyorum."));c.append(el("p","sub","16 görev, daha fazla seçenek ve her soruda bir admin tahmini. Her cevapta rozet kazanırsın. İstemediğin soruyu geçebilirsin."));const b=el("button","btn","Başla");b.onclick=e=>{burst(e);next()};c.append(b);c.append(el("p","note","Admin tahminleri Hamza tarafından önceden belirlenmiştir. Cevapların gönderilmesi tamamen senin kararın."))})}
function next(){i++;if(i>=Q.length)return finish();$("top").hidden=false;$("fill").style.width=(i/Q.length*100)+"%";$("lvl").textContent="Görev "+(i+1)+"/"+Q.length;ask(Q[i])}
function done(ev,val){if(val!==undefined&&val!==""&&!(Array.isArray(val)&&!val.length)){A[Q[i].k]=val;$("box").append(el("span",null,badges[i%badges.length]));burst(ev)}next()}
function ask(q){show(c=>{
 c.append(el("h2",null,q.e+" "+q.q),el("p","sub",q.s));let get=()=>"";
 const ok=el("button","btn","Devam");ok.disabled=true;const set=v=>{ok.disabled=!(Array.isArray(v)?v.length:v)};
 if(q.t==="text"||q.t==="date"||q.t==="area"){const f=q.t==="area"?el("textarea"):el("input");if(q.t==="text")f.maxLength=40;if(q.t==="date")f.type="date";if(q.ph)f.placeholder=q.ph;f.oninput=()=>set(f.value.trim());get=()=>f.value.trim();c.append(f);setTimeout(()=>q.t!=="date"&&f.focus(),150)}
 else if(q.t==="color"){let v="";const w=el("div","sw");const hint=el("p","note","");q.o.forEach(([n,h])=>{const b=el("button");b.style.background=h;b.title=n;b.setAttribute("aria-label",n);b.onclick=()=>{v=n;[...w.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");hint.textContent="Seçtiğin: "+v;set(v)};w.append(b)});get=()=>v;c.append(w,hint)}
 else{const multi=q.t==="multi";let v=multi?[]:"";const g=el("div","opts");q.o.forEach(([ic,n])=>{const b=el("button","opt");b.append(el("b",null,ic),document.createTextNode(n));b.onclick=()=>{if(multi){const k=v.indexOf(n);k<0?v.push(n):v.splice(k,1);b.classList.toggle("on")}else{v=n;[...g.children].forEach(x=>x.classList.remove("on"));b.classList.add("on")}set(v)};g.append(b)});get=()=>v;c.append(g)}
 const admin=el("div","admin");admin.append(el("div","admin-head","🔎 ADMIN TAHMİNİ"));const guess=q.admin.guess;admin.append(el("p","guess","Tahminim: "+(Array.isArray(guess)?guess.join(", "):guess)));admin.append(el("p","comment","“"+q.admin.comment+"”"));c.append(admin);
 const row=el("div","row");ok.onclick=e=>done(e,get());const sk=el("button","skip","Geç");sk.onclick=e=>done(e,undefined);row.append(ok,sk);c.append(row);if(q.note)c.append(el("p","note",q.note));
})}
function fmtDate(v){const [y,m,d]=v.split("-").map(Number);const ay=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"][m-1];return d+" "+ay+(y?" "+y:"")}
function lines(){const labels={ad:"Hitap",renk:"Rengi",cikolata:"Çikolata",kahve:"İçeceği",tatli:"Tatlı / tuzlu",yemek:"Favori yemek",dogum:"Doğum günü",mekan:"Kaçış yeri",muzik:"Müzik",cicek:"Çiçek",mevsim:"Mevsim",film:"Film / dizi",hayvan:"Ev arkadaşı",sosyal:"Sosyal tarz",hobi:"Hobiler",hayal:"Yapmak istediği"};return Object.entries(labels).filter(([k])=>A[k]!==undefined).map(([k,l])=>[l,k==="dogum"?fmtDate(A[k]):Array.isArray(A[k])?A[k].join(", "):A[k]])}
function compare(){let total=0,correct=0,details=[];Q.forEach(q=>{if(A[q.k]===undefined)return;const g=q.admin.guess;let hit=false;if(q.t==="choice"||q.t==="color")hit=typeof g==="string"&&g.toLocaleLowerCase("tr")===String(A[q.k]).toLocaleLowerCase("tr");else if(q.t==="multi"&&Array.isArray(g)){const matched=g.filter(x=>A[q.k].includes(x));hit=matched.length>0;details.push({name:q.q,hit,extra:matched.length+"/"+g.length+" tahmin eşleşti"});total++;if(hit)correct++;return}else if(q.t==="date"||q.t==="text"||q.t==="area")return;total++;if(hit)correct++;details.push({name:q.q,hit})});return{total,correct,details}}
function finish(){$("fill").style.width="100%";$("lvl").textContent="Tamamlandı";for(let k=0;k<8;k++)setTimeout(()=>spark(Math.random()*innerWidth,innerHeight*.6),k*100);const L=lines(),C=compare();const msg="Profilim hazır 😎\n"+L.map(x=>x[0]+": "+x[1]).join("\n")+"\n— Admin tahmin sonucu: "+C.correct+"/"+C.total;
